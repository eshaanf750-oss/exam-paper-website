<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#151b2a" />
<title>Paper Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<style type="text/tailwindcss">

/*
 * Theme: deep navy + brass (dark, lekin bilkul kala nahi).
 * Rang badalne hon to sirf yahan ke tokens badlein.
 */
@theme {
  --font-sans: "Figtree", ui-sans-serif, system-ui, sans-serif;
  --font-paper: "Tinos", "Times New Roman", Times, serif;

  --color-board: #151b2a;        /* sidebar + mobile header */
  --color-board-light: #1d2538;
  --color-chalk: #d6b25e;        /* brass / gold accent – primary action */
  --color-chalk-dark: #bf9a45;

  --color-surface: #1b2233;      /* app background */
  --color-card: #232c40;         /* panels, tables, modals */
  --color-card-2: #2a3449;       /* table head, hover, segmented controls */
  --color-input: #1e2638;        /* form fields */
  --color-line: #333e56;         /* borders */
  --color-line-strong: #46526d;

  --color-ink: #eceef3;          /* main text */
  --color-soft: #c9cfdb;         /* labels */
  --color-muted: #9aa3b7;        /* secondary text */
  --color-faint: #6f7991;        /* placeholders, hints */
}

:root {
  color-scheme: dark; /* date picker, select, scrollbars bhi dark */
}

body {
  @apply bg-surface text-ink font-sans antialiased;
}

/* Print setup: A4 page, only the paper is printed */
@media print {
  @page {
    size: A4;
    margin: 12mm;
  }
  :root {
    color-scheme: light;
  }
  html,
  body {
    background: #fff !important;
    color: #000 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}

.avoid-break {
  break-inside: avoid;
  page-break-inside: avoid;
}

:focus-visible {
  outline: 2px solid var(--color-chalk);
  outline-offset: 2px;
}

</style>
<style>html,body{background:#1b2233;color:#eceef3;margin:0} @media print{html,body{background:#fff;color:#000}}</style>
